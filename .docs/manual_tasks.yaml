# Note that tasks can't necessarily be followed in order

System Settings:
  Apple ID:
    iCloud:
      Password \& Keychain: False
      iCloud Mail: False
      Contacts: False
      iCloud Calendar: False

  Network:
    Firewall:
      Firewall: True

  General:
    Software Update:
      Automatic Updates:
        Install macOS Updates: False
    Storage:
      - Remove GarageBand and related components
    Login Items & Extensions:
      Extensions:
        By Category:
          Sharing:
            Telegram: True
            Subscribe in Unread: True

  Apple Intelligence \& Siri:
    Apple Intelligence: True
    Siri: True
    Listen for: \"Siri" or "Hey Siri"
    Keyboard shortcut: Hold Command Space
    Voice: British (Voice 1)
    Extensions:
      ChatGPT:
        Use ChatGPT: True

  Displays:
    Display Settings:
      Built-in Retina Display:  # Requires lid open
        Resolution: More Space
        Automatically adjust brightness: False
        Colour profile: Set for display
      Acer B346CK:
        Use as: Extended display
        Colour profile: Set for display
        Rotation: 90
      Acer X34:
        Use as: Main display
        Colour profile: Set for display
        Refresh Rate (Hz): 100

  Menu Bar:
    Menu Bar Controls:
      Siri: False
      Spotlight: False
      Wi-Fi: False
      Battery:
        - Enabled: True
        - Battery Options:
            Show Percentage: True
      Screen Mirroring: False
      Display: False
      Sound: False


  Notifications:
    Show Notifications:
      when display is sleeping: False

  Privacy \& Security:
    Location Services:
      Enabled: True
      System Services:
        Networking and wireless: False
        Mac Analytics: False
    Analytics \& Improvements:
      Share Mac Analytics: False  # default, Might be re-enabled when sharing crash reports
    Apple Advertising:
      Personalised Ads: False

  Touch ID \& Password:
    Touch ID: Add fingerprints

  Internet Accounts: Configure as appropriate

  Keyboard:
    Adjust keyboard brightness in low light: False
    Keyboard Shortcuts:
      Dock:
        Turn Dock hiding on/off: False
      Mission Control:
        Mission Control: Alt + Ctrl + M
        Show Notification Center: Alt + N
        Turn Do Not Disturb On/Off: Alt + Shift + N
        Application windows: Alt + A
        Mission Control: False
      Keyboard:
        Move focus to next window: Alt + Tab
      Input Sources:
        Select the previous input source: False  # Otherwise blocks Ctrl-Space for zsh-autocomplete
        Select next source in Input menu: False
      Spotlight:
        Show Spotlight search: False
      Modifier Keys:
        Planck:
          Option: Command
          Command: Option
    Input Sources:
      Edit:
        Sources:
          - British - PC
        All Input Sources:
          # Scriptable, but enabled by changing input sources, so do this
          # afterwards
          Show Input menu in menu bar: False

Applications:
  App Store:
    Settings:
      Automatic Updates: True
      In-App Ratings \& Reviews: False

  Safari:
    Settings:
      General:
        Open "safe" files after downloading: False
        Remove download list items: When Safari quits
        AutoFill:
          Using information from my contacts: False
          Usernames and passwords: False
          Credit cards: False
          Other forms: False
      Search:
        Search engine: DuckDuckGo
      Websites:
        Page Zoom:
          When visiting other websites (%): 85
      Extensions:
        PiPifier:
          Allow in Private Browsing: True
        uBlock Origin Lite:
          Allow in Private Browsing: True
          Always Allow on Every Website: True
    View Menu:
      Always Show Tab Bar: True
      Show status bar: True
    Toolbar:
      - Sidebar
      - Back/Forward
      - Flexible Space
      - Address and Search
      - Privacy Report
      - uBlock Origin Lite
      - PiPifier
      - Flexible Space
      - Share

  asciinema: Run `asciinema auth`

  Calendar:
    Settings:
      Accounts:
        Work:
          Refresh Calendars: Every 5 minutes
    Calendars:
      - Delete all local calendars (On My Mac)
    View menu options:
      Show Declined Events: True

  Contacts:
    Settings:
      General:
        Sort By: First Name

  Finder:
    View menu options:
      Sort By:
        Snap to Grid: True  # While on Desktop
      Show Path Bar: True  # While in Finder window

  Google Chrome:
    Welcome to Google Chrome:
      Make Google Chrome the default browser: False
      Automatically send usage statistics and crash reports to Google: False
    Menu options:
      Warn Before Quitting: False

  IINA:
    Utilities:
      Set IINA as the Default Application:
        - Video  # default
        - Audio  # default
        - Playlist  # default

  iTerm2:
    General:
      Settings:
        Load preferences from a custom folder or URL: ~/.config/iterm2/

  LaunchBar:
    bswinnerton/launchbar-github:
      - Grant access: https://github.com/bswinnerton/launchbar-github#github-access-token

  Mail:
    Preferences:
      Accounts:
        All:
          Account Information:
            Email Address:
              Edit Email Addresses:
                - Set "Full Name" correctly
            Download Attachments: False
          Mailbox Behaviours:
            Erase deleted messages: False
      Fonts \& Colours:
        Fixed-width font: SauceCodePro NF Regular 11
        Use fixed-width font for plain text messages: True
        Colour quoted text: False
      Composing:
        Undo send delay (seconds): 30
        Use the same message format as the original message: True
    Mailbox List:
      - Shrink Favourites
    Categories: Turn Off

  Qobuz:
    Menu:
      Synchronise with OS settings: True
    Settings:
      Music playing:
        Favorite Audio Output: WH-1000XM3

  Slack:
    # All settings per-workspace unless specified otherwise
    Themes:
      Sync with OS setting: True  # Global
      Colours: Aubergine (Clean and minimal)
    Messages \& media:
      Theme: Compact
      Names: Full & display names
      Show times with 24-hour clock: True
      Show one-click reactions on messages: My most frequently used emoji
    Language \& region:
      Language: English (UK)
    Accessibility:
      Zoom (%): 80  # Global
      Underline links to websites: True
      Automatically play animations in Slack: False
    Mark as read:
      When I view a channel: Start me at the newest message but leave unseen messages unread
    Advanced:
      Format messages with markup: True
      Send me occasional channel suggestions via Slackbot: False
      Send me occasional surveys via Slackbot: False
      Disable hardware acceleration: True  # Global

  SoundSource:
    Other:
      - Remove default effects, set default devices

  Telegram:
    # First sign-in doesn't work with proxy
    General:
      Show Icon in Menu Bar: False
    Notifications and Sounds:
      Message Preview: False
      Notification Tone: Tremolo
      When app is in focus:
        Show notifications: True
    Data and Storage:
      Storage Usage:
        Maximum Cache Size: 16GB
        Auto-Remove Cached Media:
          Private Chats: 1 month
      Download Folder: ~/Downloads/Telegram/
    Appearance:
      Color Theme: System

  Unread:
    General:
      Read \& unread:
        Confirm mark all read: False
        Dock icon badge: True
      Article lists:
        Show thumbnails: False
    Accounts: Set up
    Font Sizes:
      Article list (%): 90  # Configurable via defaults
      Article (%): 90  # Configurable via defaults
      Use fixed maximum article width: Maximum

  Web apps:
    - Google Finance

  WireGuard:
    - Add VPN configuration, see https://github.com/jmcvaughn/dotfiles/tree/home-router/.docs#wireguard

  zoom.us:
    General:
      Always show meeting controls: True
      Ask me to confirm when I leave a meeting: False
      Show meeting timers: True
      Add Zoom to macOS menu bar: False
      Stop my video and audio when my display is off or screen saver begins: True
    Video:
      Original ratio: True
      HD: True
      Always display participant name on their videos: True
      Stop my video when joining a meeting: True
      Always show video preview dialog when joining: False
    Audio:
      Speaker: Same as System
      Microphone: Same as System
      Automatically join computer audio when joining: True
      Mute my mic when joining: True
    Share Screen:
      Window size when screen sharing: Maintain current size
      When I share directly to a Zoom Room: Show all sharing options

File associations:
  less.app:
    - .cfg
    - .conf
    - .csv
    - .ini
    - .log
    - .md
    - .out
    - .txt
    - .xml
    - .yaml/.yml  # macOS is smart enough to know these are the same

